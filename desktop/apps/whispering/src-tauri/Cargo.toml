[package]
name = "voiceflow"
version = "0.9.23"
description = "VoiceFlow desktop dictation app (based on Whispering)"
authors = ["you"]
edition = "2021"

[package.metadata]
# Set minimum macOS version (C++17 filesystem support needs 10.15; the UI
# needs a WebKit from Safari 16.4, which macOS 11 and later can have)
cargo-target-macos-version = "11.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "voiceflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tokio = { version = "1", features = ["full"] }
dotenvy_macro = "0.15"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "image-png", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
enigo = "0.5.0"
cpal = "0.16.0"
tracing = "0.1.41"
thiserror = "2.0.12"
hound = "3.5"
# VoiceFlow: uploads are 16 kHz mono FLAC, encoded in pure Rust (no FFmpeg needed).
flacenc = { version = "0.5", default-features = false }
lazy_static = "1.4"
tempfile = "3.8"
rubato = "0.15"
tauri-plugin-macos-permissions = "2.3.0"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
regex = "1"
rayon = "1.10"
log = "0.4"
tauri-plugin-log = "2"
# VoiceFlow: provider API keys live in the OS credential store (spec §2.3).
keyring-core = "1"
# VoiceFlow (speed): one pooled HTTPS client for the OpenAI API. Same
# version and features tauri-plugin-http already builds, so no new crates.
# 0.9.19: `blocking` for the GitHub word-list source, which runs on the
# profile worker thread (profile/github.rs).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "blocking"] }
# VoiceFlow C1: app icons are returned to the page as data URLs.
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_Security"] }
# VoiceFlow C1: app icons read from an .exe are cached as PNG.
png = "0.17"
# VoiceFlow: the password-field check reads the focused element through UI Automation (COM; spec §4.1).
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility"] }
# Windows: Only parakeet is available due to MSVC runtime library conflicts (MT_StaticRelease vs MD_DynamicRelease)
# - whisper-cpp: whisper-rs-sys conflicts with tokenizers/esaxx-rs
# - moonshine: tokenizers/esaxx-rs (static CRT) conflicts with ort (dynamic CRT)
# Parakeet works because it uses ort without tokenizers dependency
transcribe-rs = { version = "0.2.1", features = ["parakeet"] }

[target.'cfg(not(windows))'.dependencies]
# macOS/Linux: full whisper-cpp support
transcribe-rs = { version = "0.2.1", features = ["whisper", "parakeet", "moonshine"] }

[target.'cfg(target_os = "windows")'.dependencies.windows-native-keyring-store]
version = "1"

[target.'cfg(target_os = "macos")'.dependencies.apple-native-keyring-store]
version = "1"
features = ["keychain"]

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys =  "0.1.3"
core-foundation-sys =  "0.8.7"
# VoiceFlow: the frontmost app at the hotkey (spec §4.1).
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSData", "NSDictionary"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "NSWorkspace", "libc", "NSImage", "NSImageRep", "NSBitmapImageRep"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
# The following optimizations are disabled due to CoreAudio FFI crashes on macOS.
# These aggressive optimizations can cause segmentation faults when CPAL interfaces
# with CoreAudio, resulting in null pointer dereferences in HALDeviceList::GetData.
# 
# We may re-enable these in the future when:
# - CPAL fixes the underlying FFI safety issues
# - Rust's optimization passes better handle FFI boundaries
# - We implement our own audio backend that doesn't rely on CPAL
#
# For more information on Tauri app size optimization, see:
# https://v2.tauri.app/concept/size/
#
# codegen-units = 1 # Allows LLVM to perform better optimization.
# lto = true # Enables link-time-optimizations.
# opt-level = "s" # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort" # Higher performance by disabling panic handlers.
strip = true # Ensures debug symbols are removed.
